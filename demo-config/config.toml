# ---
# Claxis — Configuration demo file
# ---

[Path]
theme = "~/.config/claxis/theme"     # указывается папка, это дефолт путь в Linux и он не пишется. настройка нужна толко для не дефолт путей.
# edit = "любой/не/дефолт/путь"
# command = "аналогично"
# file = "аналогично"
# setting = "аналогично"     # новое состояние, там будут некоторые только настройки прямо из редактора, конфиг — основной способ и главный.

[General]
language = "rus"     # enum rus, eng, deu... Standart of langs codes — ISO 639-3
color_modes = true
insert_final_newline = true

# mouse settings
mouse_enable = true
middle_click_paste = true
selection_auto_copy = false     # 
step_scroll_lines = 3     # u8 1..255. Меньше 0 ошибка

# space edit settings
end_padding = 5     # u8 0..255. 0 не работает значит
shell_os = "unix"     # enum unix = "sh -c" / windows = "cmd.exe /C"
numberline = "relative"     # enum absolute or relative.
cursor_numberline = "column_start"     # enum column_start or column_end
continue_comments = true     # if you create a new line while in the comment line, the new line will continue the comment.
auto_completion = true
path_completion = { files = true, directory = true }     # files = bool, directory = bool
max_line_width = 0     # u8 0..255. 0 не работает значит

[Statusline]
left = []
center = []
right = [ , "position"  ]     # 

[Statusline.States]     # Отображаемые имена состояний в статус линии
edit = "Edit"
command = "Command"
file = "File"

[Statusline.Modes]     # Отображаемые имена режимов в статус линии
# state edit
type = "Type"
view = "View"
replace = "Replace"
selection = "Selection"
search = "Search"
# state file none search and selection
file_manager = "Manager"
git = "Git"

[Statusline.Setting]
position = {
    file = "{percent}",
    cursor = "{line}:{line_char}",
    selection = "{number} char"
}     # selection = "{percent}", cursor = "{char}", file = ""

[Commandline]
hide = true
position = "center"

[Keyboard]


[Startscreen]     # Начальный экран
include = true

[Savescreen]     # После сохранения экран со статистикой
include = true
mode = "fullscreen"     # enum из режимов на весь эран, окном или сообщением. fullscreen, message, window

[Savescreen.Statistic]
input_char = true
delete_char = true
history_usage = true
key_time = true     # time of typing session
time = true     # time of session

[Savescreen.Setting]
input_char = [ "all", "rus", "eng", "deu" ]     # filtering input char session
delete_char = [ "all", "rus", "eng", "deu" ]     # filtering delete char session
history_usage = { used = "{percent}", remaining = "{number}" }     # remaining = max - used

