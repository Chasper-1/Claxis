[package]
name = "claxis-disk"
version = "0.1.1"
edition = "2024"

[features]
# Временные каталоги для тестов других крейтов.
test-support = []

[dependencies]
claxis-text = { path = "../claxis-text" }
# bundled: SQLite собирается из исходников, системный пакет не нужен.
rusqlite = { version = "0.37", features = ["bundled"] }
# Наблюдение за файлами нужно всем, а доступно не всем: зависимость живёт
# здесь и наружу не выходит.
notify = "8"