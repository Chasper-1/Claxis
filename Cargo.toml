[workspace]
members = ["claxis-text", "claxis-buffer", "claxis-store", "claxis-input", "claxis-term", "claxis-i18n", "claxis-config"]

[package]
name = "Claxis"
version = "0.2.4"
edition = "2024"

# Бинарная цель остаётся `Claxis`, библиотечная — `claxis`: слой API и
# маршрутизатор публичны и должны называться по правилам Rust.
[lib]
name = "claxis"
path = "src/lib.rs"

[dependencies]
claxis-text = { path = "claxis-text" }
claxis-buffer = { path = "claxis-buffer" }
claxis-store = { path = "claxis-store" }
claxis-input = { path = "claxis-input" }
claxis-term = { path = "claxis-term" }
claxis-i18n = { path = "claxis-i18n" }
claxis-config = { path = "claxis-config" }
toml_edit = "0.22"