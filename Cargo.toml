[workspace]
members = ["claxis-text", "claxis-buffer", "claxis-disk", "claxis-input", "claxis-term", "claxis-i18n", "claxis-theme", "claxis-rope", "claxis-config", "claxis-commands"]

[package]
name = "Claxis"
version = "0.5.1"
edition = "2024"

# Бинарная цель остаётся `Claxis`, библиотечная — `claxis`: слой API и
# маршрутизатор публичны и должны называться по правилам Rust.
[lib]
name = "claxis"
path = "src/lib.rs"

[dependencies]
claxis-text = { path = "claxis-text" }                    # all crates

claxis-config = { path = "claxis-config" }                # Claxis
claxis-term = { path = "claxis-term" }                    # Claxis
claxis-commands = { path = "claxis-commands" }            # Claxis

claxis-buffer = { path = "claxis-buffer" }                # Claxis
claxis-rope = { path = "claxis-rope" }                    # Claxis
claxis-disk = { path = "claxis-disk" }                    # Claxis, claxis-config

claxis-input = { path = "claxis-input" }                  # claxis-config
claxis-i18n = { path = "claxis-i18n" }                    # claxis-config
claxis-theme = { path = "claxis-theme" }                  # claxis-config
toml_edit = "0.22"                                        # claxis-config, claxis-i18n, Claxis

crossterm = "0.29"                                        # claxis-term
