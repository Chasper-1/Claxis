[workspace]
members = ["claxis-text", "claxis-core", "claxis-buffer", "claxis-disk", "claxis-save", "claxis-input", "claxis-term", "claxis-i18n", "claxis-theme", "claxis-config", "claxis-commands"]
# `cargo bench` без флагов должен запускать бенчмарки ядра и буфера, а не
# только тестовую обвязку корневого пакета. Остальные команды по-прежнему
# ходят по всему workspace явно.
default-members = [".", "claxis-core", "claxis-buffer"]

[package]
name = "claxis"
version = "0.5.7"
edition = "2024"

# Слой API и маршрутизатор публичны и должны называться по правилам Rust.
[lib]
name = "claxis"
path = "src/lib.rs"

[dependencies]
claxis-text = { path = "claxis-text" }                    # all crates

claxis-config = { path = "claxis-config" }                # Claxis
claxis-term = { path = "claxis-term" }                    # Claxis
claxis-commands = { path = "claxis-commands" }            # Claxis

claxis-core = { path = "claxis-core" }                    # Claxis
claxis-buffer = { path = "claxis-buffer" }                # Claxis
claxis-disk = { path = "claxis-disk" }                    # Claxis, claxis-config
claxis-save = { path = "claxis-save" }                    # Claxis

claxis-input = { path = "claxis-input" }                  # claxis-config
claxis-i18n = { path = "claxis-i18n" }                    # claxis-config
claxis-theme = { path = "claxis-theme" }                  # claxis-config
toml_edit = "0.22"                                        # claxis-config, claxis-i18n, Claxis

crossterm = "0.29"                                        # claxis-term

[dev-dependencies]
# Временные каталоги для тестов: убирают за собой.
claxis-disk = { path = "claxis-disk", features = ["test-support"] }
